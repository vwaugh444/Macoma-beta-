<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Macoma interest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* Who wants Macoma before launch: totals, sign-ups per day, and what people told us. */
    main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 0 48px; display: grid; gap: 18px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header h1 { font: 700 28px/1.1 var(--round); display: flex; align-items: center; gap: 10px; }
    .card { border-radius: 26px; padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
    .card h2 { font-size: 17px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .tile { border-radius: 22px; padding: 16px 18px; display: grid; gap: 4px; }
    .tile b { font: 700 34px/1 var(--round); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .tile span { font-size: 13.5px; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

    /* Sign-ups per day: one series, one hue, rounded ends at the top, 2px gaps, recessive baseline. */
    .daily { position: relative; height: 180px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; align-items: end; border-bottom: 1px solid var(--hairline); }
    .daily button { all: unset; height: 100%; display: flex; align-items: flex-end; cursor: default; }
    .daily i { display: block; width: 100%; min-height: 1px; background: var(--blue); border-radius: 4px 4px 0 0; }
    .daily button:hover i, .daily button:focus-visible i { filter: brightness(1.15); }
    .axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tip { position: absolute; pointer-events: none; transform: translate(-50%, -110%); padding: 6px 10px; border-radius: 12px; font-size: 13px; white-space: nowrap; color: var(--ink); }

    /* Breakdowns: labeled horizontal bars, value in ink beside each. */
    .bars { display: grid; gap: 10px; }
    .bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 14.5px; }
    .bar .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .t { height: 10px; border-radius: 0 4px 4px 0; background: var(--hairline); overflow: hidden; }
    .bar .t i { display: block; height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; }
    .bar .n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4ch; text-align: right; }
    .empty { color: var(--muted); font-size: 14.5px; }
    details summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
    table { border-collapse: collapse; font-size: 13.5px; margin-top: 8px; font-variant-numeric: tabular-nums; }
    td, th { padding: 4px 12px 4px 0; text-align: left; }

    .gate { max-width: 420px; margin: 12vh auto 0; }
    .gate form { display: grid; gap: 12px; }
  </style>
</head>
<body>
<div class="fields" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<section class="card glass gate" id="gate">
  <h1 style="font:700 24px/1.2 var(--round)">Waitlist dashboard</h1>
  <p class="fine">Paste the OPS_TOKEN from your server settings. It stays in this tab only.</p>
  <form id="gf">
    <div class="field"><input id="token" type="password" autocomplete="off" placeholder="OPS_TOKEN" aria-label="OPS token"><button class="cta" type="submit">Open</button></div>
    <p class="msg err" id="gm" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <header>
    <h1><img src="/brand/mark.svg" width="34" height="34" alt="" style="border-radius:8px">Waitlist</h1>
    <span style="display:flex;gap:8px"><button class="ghost" id="refresh" type="button">Refresh</button><button class="cta" id="csv" type="button">Download CSV</button></span>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="card glass" aria-labelledby="d-h">
    <h2 id="d-h">Sign-ups per day, last 30 days</h2>
    <div class="daily" id="daily" role="img" aria-label="Sign-ups per day"></div>
    <div class="axis"><span id="d0"></span><span id="d1"></span></div>
    <details><summary>Show as a table</summary><table id="dtable"></table></details>
  </section>

  <div class="grid2">
    <section class="card glass"><h2>What they'd hand off first</h2><div class="bars" id="wants"></div></section>
    <section class="card glass"><h2>Business type</h2><div class="bars" id="business"></div></section>
    <section class="card glass"><h2>Plan they'd pick</h2><div class="bars" id="plan"></div></section>
    <section class="card glass"><h2>Where they came from</h2><div class="bars" id="source"></div></section>
  </div>
  <section class="card glass"><h2>Top sharers</h2><div class="bars" id="referrers"></div></section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LABELS = {
    trades: "Trades & home services", beauty: "Salon & beauty", food: "Food & catering", retail: "Retail & online shop",
    services: "Consulting & agency", health: "Health & fitness", other: "Something else",
    invoices: "Invoices & getting paid", running_late: "Running-late texts", follow_ups: "Following up leads",
    reorders: "Remembering reorders", brief: "Morning brief", reminders: "Reminders",
    personal: "Personal · $19", business: "Business · $59", crew: "Crew · $149", unsure: "Not sure yet",
  };
  const store = { get() { try { return sessionStorage.getItem("macoma_ops"); } catch { return null; } }, set(v) { try { sessionStorage.setItem("macoma_ops", v); } catch {} } };
  let token = store.get();

  async function get(url) {
    const res = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
    if (res.status === 401) throw new Error("That token didn't work.");
    if (!res.ok) throw new Error("Couldn't load the numbers.");
    return res;
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "–");

  function bars(id, rows) {
    const box = $(id); box.replaceChildren();
    if (!rows.length) return box.append(el("p", "empty", "Nothing yet."));
    const max = Math.max(...rows.map((r) => r.n));
    for (const r of rows) {
      const row = el("div", "bar");
      const t = el("div", "t"); const i = el("i"); i.style.width = `${(r.n / max) * 100}%`; t.append(i);
      row.append(el("span", "k", LABELS[r.k] || r.k), t, el("span", "n", r.n.toLocaleString()));
      box.append(row);
    }
  }

  function daily(rows) {
    const box = $("daily"); box.replaceChildren();
    const max = Math.max(1, ...rows.map((r) => r.n));
    const tip = el("div", "tip glass"); tip.hidden = true;
    const fmt = (d) => new Date(`${d}T12:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    for (const r of rows) {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-label", `${fmt(r.day)}: ${r.n}`);
      const i = el("i"); i.style.height = `${(r.n / max) * 100}%`; b.append(i);
      const show = () => { tip.hidden = false; tip.textContent = `${fmt(r.day)} · ${r.n} sign-up${r.n === 1 ? "" : "s"}`; tip.style.left = `${b.offsetLeft + b.offsetWidth / 2}px`; tip.style.top = `${box.offsetHeight - (r.n / max) * box.offsetHeight}px`; };
      b.addEventListener("mouseenter", show); b.addEventListener("focus", show);
      b.addEventListener("mouseleave", () => (tip.hidden = true)); b.addEventListener("blur", () => (tip.hidden = true));
      box.append(b);
    }
    box.append(tip);
    $("d0").textContent = fmt(rows[0].day); $("d1").textContent = "Today";
    const t = $("dtable"); t.replaceChildren();
    const head = el("tr"); head.append(el("th", "", "Day"), el("th", "", "Sign-ups")); t.append(head);
    for (const r of [...rows].reverse()) { const tr = el("tr"); tr.append(el("td", "", fmt(r.day)), el("td", "", String(r.n))); t.append(tr); }
  }

  async function load() {
    const d = await (await get("/api/admin/waitlist")).json();
    const t = d.totals;
    $("tiles").replaceChildren(...[
      [t.total.toLocaleString(), "on the waitlist"],
      [t.today.toLocaleString(), "joined in the last 24 hours"],
      [t.week.toLocaleString(), "joined in the last 7 days"],
      [pct(t.referred, t.total), "came from a friend's link"],
      [pct(t.text_ok, t.total), "want a launch text"],
    ].map(([v, k]) => { const x = el("div", "tile glass"); x.append(el("b", "", v), el("span", "", k)); return x; }));
    daily(d.daily);
    bars("wants", d.wants); bars("business", d.business); bars("plan", d.plan); bars("source", d.source); bars("referrers", d.referrers);
    $("gate").hidden = true; $("app").hidden = false;
  }

  $("gf").addEventListener("submit", async (e) => {
    e.preventDefault();
    token = $("token").value.trim(); $("gm").textContent = "";
    try { await load(); store.set(token); } catch (err) { $("gm").textContent = err.message; }
  });
  $("refresh").addEventListener("click", () => load().catch((err) => alert(err.message)));
  $("csv").addEventListener("click", async () => {
    try {
      const res = await get("/api/admin/waitlist.csv");
      const a = el("a"); a.href = URL.createObjectURL(await res.blob());
      a.download = `macoma-waitlist-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (err) { alert(err.message); }
  });
  if (token) load().catch(() => { $("gate").hidden = false; });
})();
</script>
</body>
</html>
