<script>
// TRADE: a plumber's day from the truck. Running late, invoice from the driveway,
// the customer pays with Apple Pay, supplies remembered.
const D = 47;
const P = { x: 1160, y: 110, s: 1.12 };
const thread = F.thread([
  ["day", "Today 7:58 AM", 4.0],
  ["me", "running 15 late to johnson", 6.65],
  ["typing", 7.0, 8.0],
  ["it", "Johnson job is 8:15 at 412 Elm St (from your calendar). Here's a text for Dana:", 8.0],
  ["draft", { to: "To Dana Johnson (customer)", text: "Hi Dana, it's Marcus with Rivera Plumbing. Running about 15 min behind, see you around 8:30. Sorry for the wait!" }, 8.7],
  ["me", "YES", 10.95],
  ["it", "Sent to Dana ✓", 11.6],
  ["it", "💬 Dana Johnson replied:\n\"No problem, door's unlocked 👍\"", 13.2],
  ["day", "11:20 AM", 15.2],
  ["me", "invoice dana $450 water heater flush, due friday", 17.45],
  ["typing", 17.8, 18.6],
  ["it", "Invoice ready. Reply YES to send it with an Apple Pay link:", 18.6],
  ["inv", { num: "INV-0042", due: "Due Fri", amount: "$450.00", to: "Dana Johnson", what: "Water heater flush" }, 19.2],
  ["me", "YES", 21.25],
  ["it", "Sent by text. I'll tell you when it's paid.", 21.9],
  ["day", "4:40 PM", 34.6],
  ["me", "low on 1/2 inch copper fittings", 36.45],
  ["typing", 36.8, 37.5],
  ["it", "Reorder reminder set for Monday 7:00 AM: ½\" copper fittings 📦", 37.5],
]);

// Dana's phone: the invoice page she opens from the text, paid with Apple Pay.
const at = F.at;
const invoicePage = `<div class="page">
  <div class="biz">Rivera Plumbing</div>
  <div class="card"><span style="color:#6e6e73;font-size:15px">Invoice INV-0042 · Due Friday</span><span class="big">$450.00</span><span style="font-size:16px;color:#3a3a3c">Water heater flush</span></div>
  <div class="applepay" ${at({ in: 25.0, fx: "press" })}>Pay with Apple Pay</div>
  <div style="text-align:center;font-size:14px;color:#8e8e93">or pay with card</div>
  <div class="card done" style="position:absolute;left:20px;right:20px;top:250px" ${at({ in: 25.6, fx: "pop", sfx: "pay" })}>
    <span class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <b style="font-size:22px">Paid · $450.00</b><span style="color:#6e6e73;font-size:15px">Thanks, Dana! Receipt sent.</span>
  </div>
</div>`;

document.getElementById("stage").innerHTML = [
  F.fields(["#ffcf7a", "#8fc1ff", "#a5e6d4", "#ffd9b0", "#c9d6ff"], D),
  F.kin("7:58 AM.", { t: 0.3, out: 3.3, y: 330 }),
  F.kin("~I-90 ~traffic. ~Johnson ~job ~at ~8:15.", { t: 1.1, out: 3.3, y: 480, cls: "small" }),

  F.phone({
    time: "7:58",
    kf: [[3.1, { x: 755, y: 1300, s: 1.12 }], [4.2, { x: 755, y: 110, s: 1.12 }], [4.6, { x: 755, y: 110, s: 1.12 }], [5.4, { ...P, ry: -10 }], [22.2, { ...P, ry: -10 }], [23.0, { x: 360, y: 200, s: 0.92, ry: 10 }],
         [28.4, { x: 360, y: 200, s: 0.92, ry: 10 }], [29.2, { x: 360, y: 1300, s: 0.92, ry: 10 }], [33.8, { ...P, y: 1300, ry: -10 }], [34.6, { ...P, ry: -10 }], [40.2, { ...P, ry: -10 }], [41.0, { ...P, y: 1300, ry: -10 }]],
    content:
      F.header() + thread +
      F.inbar([[5.0, 6.6, "running 15 late to johnson"], [10.3, 10.9, "YES"], [15.4, 17.4, "invoice dana $450 water heater flush, due friday"], [20.6, 21.2, "YES"], [34.9, 36.4, "low on 1/2 inch copper fittings"]]) +
      F.notif({ title: "Macoma", msg: "💸 Dana Johnson paid INV-0042 ($450.00)", t: 26.4, out: 28.6, y: 64 }),
  }),

  F.phone({
    time: "11:24",
    kf: [[22.4, { x: 1150, y: 1300, s: 0.92, ry: -10 }], [23.2, { x: 1150, y: 200, s: 0.92, ry: -10 }], [28.4, { x: 1150, y: 200, s: 0.92, ry: -10 }], [29.2, { x: 1150, y: 1300, s: 0.92, ry: -10 }]],
    content: invoicePage,
  }),

  F.cap({ tag: "Running late", h: "Running late?<br>Just say so.", p: "Macoma checks your calendar and writes the text to your customer.", x: 230, y: 330, t: 5.3, out: 10.0 }),
  F.cap({ tag: "Replies", h: "Their reply<br>comes to you.", p: "Customers text back like normal. You see it right here.", x: 230, y: 330, t: 10.3, out: 14.8 }),
  F.cap({ tag: "Invoices", h: "Invoice from<br>the driveway.", p: "Say what you did and what it costs. It goes out with an Apple Pay link.", x: 230, y: 330, t: 15.4, out: 22.0 }),
  F.kin("Dana pays in one tap.", { t: 23.2, out: 28.4, y: 44, cls: "small" }),
  F.kin("~You ~get ~a ~text ~when ~it ~lands.", { t: 26.4, out: 28.4, y: 122, cls: "small", gap: 0.06 }),

  F.kin("Plugs into how you already get paid.", { t: 29.4, out: 33.6, y: 70, cls: "small", gap: 0.06 }),
  F.hub({
    t: 29.8, out: 33.6, cy: 600, rx: 640, ry: 300, start: -90,
    tiles: [
      { name: "Google Calendar", note: "Jobs & addresses", color: "#4285f4", letter: "C" },
      { name: "Stripe", note: "Invoices & payouts", color: "#635bff", letter: "S" },
      { name: "Apple Pay", note: "One-tap payments", color: "#111111", icon: '<span style="font:600 30px/1 var(--text);color:#fff">Pay</span>' },
      { name: "Square", note: "Your POS account", color: "#3e4348", icon: '<span style="width:46px;height:46px;border:8px solid #fff;border-radius:11px;display:block"></span>' },
      { name: "QuickBooks", note: "Books stay current", color: "#2ca01c", letter: "qb" },
      { name: "Outlook", note: "Work calendar", color: "#0078d4", letter: "O" },
    ],
  }),

  F.cap({ tag: "Reorders", h: "Never run out<br>on a job.", p: "Mention a supply and it becomes a reminder.", x: 230, y: 330, t: 34.8, out: 40.4 }),
  F.kin("Less paperwork.\n~More jobs.", { t: 41.0, out: 43.6, y: 400 }),
  F.end({ t: 43.8, tagline: "Built for the truck." }),
].join("");
FilmStart(D);
</script>
