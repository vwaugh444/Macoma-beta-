# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Creates the website (web), the background worker and a Postgres database.
# Render asks for every `sync: false` value on the first sync; leave a connector's
# keys blank and it shows as "coming soon" until you add them.
services:
  - type: web
    name: macoma-web
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ROLE
        value: web
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: macoma-db
          property: connectionString
      - fromGroup: macoma

  - type: worker
    name: macoma-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: ROLE
        value: worker
      - key: NODE_VERSION
        value: "22"
      - key: WORKER_CONCURRENCY
        value: "32"
      - key: DATABASE_URL
        fromDatabase:
          name: macoma-db
          property: connectionString
      - fromGroup: macoma

databases:
  - name: macoma-db
    plan: basic-256mb
    postgresMajorVersion: "16"

envVarGroups:
  - name: macoma
    envVars:
      # Your web service's address, e.g. https://macoma-web.onrender.com (or your domain)
      - key: PUBLIC_URL
        sync: false
      # Render's internal database network; no TLS needed inside it
      - key: DATABASE_SSL
        value: "false"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OPS_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: STRIPE_PRICE_PERSONAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_CREW
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_ENABLED
        value: "true"
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: INTUIT_CLIENT_ID
        sync: false
      - key: INTUIT_CLIENT_SECRET
        sync: false
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_APP_SECRET
        sync: false
      - key: SQUARE_ENV
        value: sandbox
      # Invite-only while testing: new people need a tester's share link
      - key: INVITE_ONLY
        value: "true"
